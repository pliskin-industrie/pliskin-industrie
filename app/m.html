window.MOBILE = {};
/* Tablet: Android ohne "Mobile" in der Kennung, iPad, oder grosser Touch-Bildschirm */
window.HYSEC_TABLET = (function () {
  var ua = navigator.userAgent;
  return (/Android/.test(ua) && !/Mobile/.test(ua)) || /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
    || Math.min(screen.width, screen.height) >= 600;
})();
</script>
